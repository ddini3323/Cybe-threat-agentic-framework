<svg viewBox="0 0 680 820" width="680" height="820" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style>
<defs>
  <marker id="d1a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#37474F"/></marker>
  <filter id="sh3"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity=".12"/></filter>
</defs>

<!-- External: Analyst/Feed Input -->
<rect x="190" y="10" width="300" height="52" rx="8" fill="#DBEAFE" stroke="#1565C0" stroke-width="1.6" filter="url(#sh3)"/>
<text x="340" y="33" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">Analyst / Feed Input</text>
<text x="340" y="51" text-anchor="middle" font-size="10" fill="#1565C0">text · file · live CTI streams</text>

<!-- Arrow to P1 -->
<line x1="340" y1="62" x2="340" y2="102" stroke="#37474F" stroke-width="1.8" marker-end="url(#d1a)"/>
<rect x="288" y="75" width="104" height="16" rx="3" fill="white" opacity=".85"/>
<text x="340" y="87" text-anchor="middle" font-size="9" fill="#333">raw threat data</text>

<!-- P1: Ingestion -->
<rect x="155" y="108" width="370" height="65" rx="10" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.8" filter="url(#sh3)"/>
<text x="250" y="130" text-anchor="middle" font-size="11" font-weight="700" fill="#0D47A1">P1</text>
<text x="340" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#0D47A1">Ingestion &amp; Normalisation</text>
<text x="340" y="148" text-anchor="middle" font-size="10" fill="#1565C0">Event-type detection  ·  MD5 deduplication  ·  severity scoring</text>
<text x="340" y="163" text-anchor="middle" font-size="9.5" fill="#1976D2" font-style="italic">→ ThreatEvent (source, type, severity, raw_text, indicator)</text>

<!-- Arrow P1 → P2 -->
<line x1="340" y1="173" x2="340" y2="213" stroke="#37474F" stroke-width="1.8" marker-end="url(#d1a)"/>
<rect x="278" y="186" width="124" height="16" rx="3" fill="white" opacity=".85"/>
<text x="340" y="198" text-anchor="middle" font-size="9" fill="#333">ThreatEvent</text>

<!-- P2: Enrichment -->
<rect x="155" y="219" width="370" height="65" rx="10" fill="#EDE7F6" stroke="#4527A0" stroke-width="1.8" filter="url(#sh3)"/>
<text x="250" y="241" text-anchor="middle" font-size="11" font-weight="700" fill="#311B92">P2</text>
<text x="340" y="241" text-anchor="middle" font-size="12" font-weight="700" fill="#311B92">LLM Enrichment (RAG)</text>
<text x="340" y="259" text-anchor="middle" font-size="10" fill="#4527A0">llama3.2:3b + MITRE context  ·  3-stage JSON extraction</text>
<text x="340" y="274" text-anchor="middle" font-size="9.5" fill="#5E35B1" font-style="italic">→ EnrichedEvent (ttps, iocs, cves, malware_family, confidence)</text>

<!-- D1: ChromaDB -->
<rect x="556" y="222" width="108" height="62" fill="#FFF8E1" stroke="#F57F17" stroke-width="1.5" filter="url(#sh3)"/>
<line x1="556" y1="222" x2="556" y2="284" stroke="#F57F17" stroke-width="2"/>
<line x1="664" y1="222" x2="664" y2="284" stroke="#F57F17" stroke-width="2"/>
<text x="610" y="243" text-anchor="middle" font-size="9.5" font-weight="700" fill="#E65100">D1</text>
<text x="610" y="257" text-anchor="middle" font-size="9" fill="#E65100">ChromaDB</text>
<text x="610" y="270" text-anchor="middle" font-size="9" fill="#F57F17">MITRE + History</text>

<!-- Arrows P2 ↔ D1 -->
<line x1="525" y1="244" x2="556" y2="244" stroke="#F57F17" stroke-width="1.6" marker-end="url(#d1a)" stroke-dasharray="5,3"/>
<line x1="556" y1="258" x2="525" y2="258" stroke="#37474F" stroke-width="1.6" marker-end="url(#d1a)" stroke-dasharray="5,3"/>
<text x="540" y="241" text-anchor="middle" font-size="8" fill="#E65100">query</text>
<text x="540" y="268" text-anchor="middle" font-size="8" fill="#37474F">context</text>

<!-- Arrow P2 → P3 -->
<line x1="340" y1="284" x2="340" y2="324" stroke="#37474F" stroke-width="1.8" marker-end="url(#d1a)"/>
<rect x="272" y="297" width="136" height="16" rx="3" fill="white" opacity=".85"/>
<text x="340" y="309" text-anchor="middle" font-size="9" fill="#333">EnrichedEvent</text>

<!-- P3: Pattern Discovery -->
<rect x="155" y="330" width="370" height="65" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.8" filter="url(#sh3)"/>
<text x="250" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#1B5E20">P3</text>
<text x="340" y="352" text-anchor="middle" font-size="12" font-weight="700" fill="#1B5E20">Pattern Discovery</text>
<text x="340" y="370" text-anchor="middle" font-size="10" fill="#2E7D32">Weighted Jaccard similarity on TTP sets  ·  threshold ≥ 0.7</text>
<text x="340" y="385" text-anchor="middle" font-size="9.5" fill="#388E3C" font-style="italic">→ ThreatPattern (event_ids, primary_ttp, severity, confidence)</text>

<!-- D2: Pattern Store -->
<rect x="556" y="333" width="108" height="62" fill="#FFF8E1" stroke="#F57F17" stroke-width="1.5" filter="url(#sh3)"/>
<line x1="556" y1="333" x2="556" y2="395" stroke="#F57F17" stroke-width="2"/>
<line x1="664" y1="333" x2="664" y2="395" stroke="#F57F17" stroke-width="2"/>
<text x="610" y="354" text-anchor="middle" font-size="9.5" font-weight="700" fill="#E65100">D2</text>
<text x="610" y="368" text-anchor="middle" font-size="9" fill="#E65100">Pattern Store</text>
<text x="610" y="381" text-anchor="middle" font-size="9" fill="#F57F17">in-memory cache</text>

<!-- Arrow P3 ↔ D2 -->
<line x1="525" y1="355" x2="556" y2="355" stroke="#37474F" stroke-width="1.6" marker-end="url(#d1a)" stroke-dasharray="5,3"/>
<line x1="556" y1="369" x2="525" y2="369" stroke="#37474F" stroke-width="1.6" marker-end="url(#d1a)" stroke-dasharray="5,3"/>
<text x="540" y="351" text-anchor="middle" font-size="8" fill="#37474F">write</text>
<text x="540" y="380" text-anchor="middle" font-size="8" fill="#37474F">read</text>

<!-- Arrow P3 → P4 -->
<line x1="340" y1="395" x2="340" y2="435" stroke="#37474F" stroke-width="1.8" marker-end="url(#d1a)"/>
<rect x="270" y="408" width="140" height="16" rx="3" fill="white" opacity=".85"/>
<text x="340" y="420" text-anchor="middle" font-size="9" fill="#333">ThreatPattern</text>

<!-- P4: Mitigation -->
<rect x="155" y="441" width="370" height="65" rx="10" fill="#FFEBEE" stroke="#C62828" stroke-width="1.8" filter="url(#sh3)"/>
<text x="250" y="463" text-anchor="middle" font-size="11" font-weight="700" fill="#B71C1C">P4</text>
<text x="340" y="463" text-anchor="middle" font-size="12" font-weight="700" fill="#B71C1C">Mitigation Generation</text>
<text x="340" y="481" text-anchor="middle" font-size="10" fill="#C62828">Chain-of-Thought prompting  ·  MITRE D3FEND code mapping</text>
<text x="340" y="496" text-anchor="middle" font-size="9.5" fill="#E53935" font-style="italic">→ MitigationAction (d3fend_codes, priority, action_steps)</text>

<!-- Arrow P4 → P5 -->
<line x1="340" y1="506" x2="340" y2="546" stroke="#37474F" stroke-width="1.8" marker-end="url(#d1a)"/>
<rect x="266" y="519" width="148" height="16" rx="3" fill="white" opacity=".85"/>
<text x="340" y="531" text-anchor="middle" font-size="9" fill="#333">MitigationAction</text>

<!-- P5: Validation -->
<rect x="155" y="552" width="370" height="65" rx="10" fill="#E8F5E9" stroke="#1B5E20" stroke-width="1.8" filter="url(#sh3)"/>
<text x="250" y="574" text-anchor="middle" font-size="11" font-weight="700" fill="#1B5E20">P5</text>
<text x="340" y="574" text-anchor="middle" font-size="12" font-weight="700" fill="#1B5E20">Validation</text>
<text x="340" y="592" text-anchor="middle" font-size="10" fill="#2E7D32">5 deterministic safety checks  ·  status assignment</text>
<text x="340" y="607" text-anchor="middle" font-size="9.5" fill="#388E3C" font-style="italic">→ APPROVED / REJECTED / PENDING_REVIEW</text>

<!-- Arrow P5 → SOC -->
<line x1="340" y1="617" x2="340" y2="657" stroke="#37474F" stroke-width="1.8" marker-end="url(#d1a)"/>
<rect x="278" y="630" width="124" height="16" rx="3" fill="white" opacity=".85"/>
<text x="340" y="642" text-anchor="middle" font-size="9" fill="#333">validated result</text>

<!-- SOC Dashboard output -->
<rect x="190" y="663" width="300" height="52" rx="8" fill="#FCE4EC" stroke="#C62828" stroke-width="1.6" filter="url(#sh3)"/>
<text x="340" y="686" text-anchor="middle" font-size="12" font-weight="600" fill="#B71C1C">SOC Dashboard</text>
<text x="340" y="703" text-anchor="middle" font-size="10" fill="#C62828">8-page analyst interface — port 8888</text>

<!-- D1 store-back label -->
<path d="M610,222 C610,195 460,185 340,200" stroke="#E65100" stroke-width="1.3" stroke-dasharray="4,3" fill="none" marker-end="url(#d1a)"/>
<rect x="400" y="185" width="90" height="15" rx="3" fill="white" opacity=".8"/>
<text x="445" y="196" text-anchor="middle" font-size="8" fill="#E65100">store-back</text>
</svg>