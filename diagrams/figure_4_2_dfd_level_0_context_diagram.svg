<svg viewBox="0 0 720 500" width="720" height="500" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style>
<defs>
  <marker id="da" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#37474F"/></marker>
  <filter id="sh2"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity=".13"/></filter>
</defs>

<!-- Central system circle -->
<circle cx="360" cy="250" r="90" fill="#D4EDDA" stroke="#2E7D32" stroke-width="2" filter="url(#sh2)"/>
<text x="360" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#1B5E20">CTI</text>
<text x="360" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#1B5E20">Agentic</text>
<text x="360" y="274" text-anchor="middle" font-size="14" font-weight="700" fill="#1B5E20">System</text>

<!-- External entity boxes -->
<!-- TL: Security Analyst -->
<rect x="15" y="30" width="185" height="70" rx="8" fill="#DBEAFE" stroke="#1565C0" stroke-width="1.6" filter="url(#sh2)"/>
<text x="107" y="61" text-anchor="middle" font-size="12" font-weight="600" fill="#0D47A1">Security Analyst</text>
<text x="107" y="78" text-anchor="middle" font-size="10" fill="#1565C0">SOC / CTI team</text>

<!-- BL: Live Feed -->
<rect x="15" y="400" width="185" height="70" rx="8" fill="#E8F5E9" stroke="#388E3C" stroke-width="1.6" filter="url(#sh2)"/>
<text x="107" y="428" text-anchor="middle" font-size="12" font-weight="600" fill="#1B5E20">Live Feed</text>
<text x="107" y="445" text-anchor="middle" font-size="10" fill="#388E3C">Mastodon / URLhaus</text>
<text x="107" y="460" text-anchor="middle" font-size="10" fill="#388E3C">ThreatFox / Feodo</text>

<!-- TR: MITRE ATT&CK -->
<rect x="520" y="30" width="185" height="70" rx="8" fill="#FFF8E1" stroke="#F57F17" stroke-width="1.6" filter="url(#sh2)"/>
<text x="612" y="55" text-anchor="middle" font-size="12" font-weight="600" fill="#E65100">MITRE ATT&amp;CK</text>
<text x="612" y="72" text-anchor="middle" font-size="10" fill="#F57F17">Knowledge Base</text>
<text x="612" y="88" text-anchor="middle" font-size="9.5" fill="#F57F17">(ChromaDB vector store)</text>

<!-- BR: SOC Dashboard -->
<rect x="520" y="400" width="185" height="70" rx="8" fill="#FCE4EC" stroke="#C62828" stroke-width="1.6" filter="url(#sh2)"/>
<text x="612" y="428" text-anchor="middle" font-size="12" font-weight="600" fill="#B71C1C">SOC Dashboard</text>
<text x="612" y="445" text-anchor="middle" font-size="10" fill="#C62828">Analyst Output</text>
<text x="612" y="460" text-anchor="middle" font-size="9.5" fill="#C62828">port 8888</text>

<!-- Arrows with labels -->
<!-- Analyst → System -->
<line x1="200" y1="80" x2="278" y2="195" stroke="#37474F" stroke-width="1.8" marker-end="url(#da)"/>
<rect x="178" y="128" width="130" height="20" rx="3" fill="white" opacity=".85"/>
<text x="243" y="141" text-anchor="middle" font-size="9.5" fill="#333">Threat Text / File</text>

<!-- Feed → System -->
<line x1="200" y1="425" x2="278" y2="310" stroke="#37474F" stroke-width="1.8" marker-end="url(#da)"/>
<rect x="176" y="355" width="138" height="20" rx="3" fill="white" opacity=".85"/>
<text x="245" y="368" text-anchor="middle" font-size="9.5" fill="#333">Live CTI Feed Events</text>

<!-- System → MITRE -->
<line x1="446" y1="195" x2="522" y2="80" stroke="#37474F" stroke-width="1.8" marker-end="url(#da)"/>
<rect x="454" y="120" width="118" height="20" rx="3" fill="white" opacity=".85"/>
<text x="513" y="133" text-anchor="middle" font-size="9.5" fill="#333">TTP / RAG Queries</text>

<!-- MITRE → System -->
<line x1="520" y1="95" x2="444" y2="210" stroke="#37474F" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#da)"/>
<rect x="468" y="150" width="120" height="20" rx="3" fill="white" opacity=".85"/>
<text x="528" y="163" text-anchor="middle" font-size="9.5" fill="#333">Technique Context</text>

<!-- System → SOC Dashboard -->
<line x1="446" y1="305" x2="522" y2="420" stroke="#37474F" stroke-width="1.8" marker-end="url(#da)"/>
<rect x="452" y="355" width="130" height="20" rx="3" fill="white" opacity=".85"/>
<text x="517" y="368" text-anchor="middle" font-size="9.5" fill="#333">Mitigations / Reports</text>

<!-- SOC → System (approval) -->
<line x1="520" y1="408" x2="444" y2="295" stroke="#37474F" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#da)"/>
<rect x="448" y="338" width="116" height="20" rx="3" fill="white" opacity=".85"/>
<text x="506" y="351" text-anchor="middle" font-size="9.5" fill="#333">Approval Decision</text>
</svg>