<text x="390" y="413" text-anchor="middle" font-size="10.5" fill="#B2DFDB">Weighted Jaccard Similarity — threshold ≥ 0.7</text>
<text x="390" y="430" text-anchor="middle" font-size="10" fill="#80CBC4">0.4·J_TTP + 0.3·malware + 0.2·vector + 0.1·asset → ThreatPattern</text>

