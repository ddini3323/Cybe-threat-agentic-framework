    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Download SVG
  </button>
  <button class="dl-btn dl-png" id="btnPNG">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Download PNG (2×)
  </button>
</div>
</div>

<script>
const svg = document.getElementById('arch');
const FNAME = 'figure_4_3_layered_system_architecture';

document.getElementById('btnSVG').addEventListener('click', () => {
  const clone = svg.cloneNode(true);
  const s = document.createElementNS('http://www.w3.org/2000/svg','style');
  s.textContent = "text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}";
  clone.insertBefore(s, clone.firstChild);
  const blob = new Blob([new XMLSerializer().serializeToString(clone)], {type:'image/svg+xml'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = FNAME + '.svg';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});

document.getElementById('btnPNG').addEventListener('click', () => {
  const W = 920, H = 860, scale = 2;
  const clone = svg.cloneNode(true);
  const s = document.createElementNS('http://www.w3.org/2000/svg','style');
  s.textContent = "text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}";
  clone.insertBefore(s, clone.firstChild);
  clone.setAttribute('width', W * scale);
  clone.setAttribute('height', H * scale);
  clone.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const blob = new Blob([new XMLSerializer().serializeToString(clone)], {type:'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const canvas = document.createElement('canvas');
  canvas.width = W * scale; canvas.height = H * scale;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    const a = document.createElement('a');
    a.download = FNAME + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  };
  img.src = url;
});
</script>
</body>
</html>
