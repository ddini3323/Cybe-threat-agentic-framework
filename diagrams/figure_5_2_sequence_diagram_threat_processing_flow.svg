<svg viewBox="0 0 980 720" width="980" height="720" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:'Segoe UI',Tahoma,Arial,sans-serif}</style>
<defs>
  <marker id="sa" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#1A237E"/></marker>
  <marker id="sr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#888"/></marker>
  <filter id="sh5"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity=".14"/></filter>
</defs>

<!-- Actor boxes -->
<!-- Analyst: cx=60 -->
<rect x="15" y="18" width="90" height="38" rx="6" fill="#1565C0" filter="url(#sh5)"/>
<text x="60" y="42" text-anchor="middle" font-size="11" font-weight="700" fill="white">Analyst</text>
<!-- FastAPI: cx=180 -->
<rect x="135" y="18" width="90" height="38" rx="6" fill="#1565C0" filter="url(#sh5)"/>
<text x="180" y="42" text-anchor="middle" font-size="11" font-weight="700" fill="white">FastAPI</text>
<!-- Ingest: cx=300 -->
<rect x="255" y="18" width="90" height="38" rx="6" fill="#2E7D32" filter="url(#sh5)"/>
<text x="300" y="42" text-anchor="middle" font-size="11" font-weight="700" fill="white">Ingest</text>
<!-- Enrich: cx=430 -->
<rect x="383" y="18" width="94" height="38" rx="6" fill="#4527A0" filter="url(#sh5)"/>
<text x="430" y="42" text-anchor="middle" font-size="11" font-weight="700" fill="white">Enrich</text>
<!-- ChromaDB: cx=570 -->
<rect x="518" y="18" width="104" height="38" rx="6" fill="#E65100" filter="url(#sh5)"/>
<text x="570" y="38" text-anchor="middle" font-size="10.5" font-weight="700" fill="white">ChromaDB</text>
<text x="570" y="52" text-anchor="middle" font-size="9.5" fill="white">(RAG)</text>
<!-- Pattern: cx=700 -->
<rect x="655" y="18" width="90" height="38" rx="6" fill="#00695C" filter="url(#sh5)"/>
<text x="700" y="42" text-anchor="middle" font-size="11" font-weight="700" fill="white">Pattern</text>
<!-- Mitigate: cx=820 -->
<rect x="775" y="18" width="90" height="38" rx="6" fill="#C62828" filter="url(#sh5)"/>
<text x="820" y="42" text-anchor="middle" font-size="11" font-weight="700" fill="white">Mitigate</text>
<!-- Validate: cx=940 -->
<rect x="895" y="18" width="90" height="38" rx="6" fill="#37474F" filter="url(#sh5)"/>
<text x="940" y="42" text-anchor="middle" font-size="11" font-weight="700" fill="white">Validate</text>

<!-- Lifelines -->
<line x1="60" y1="56" x2="60" y2="700" stroke="#1565C0" stroke-width="1.2" stroke-dasharray="6,4"/>
<line x1="180" y1="56" x2="180" y2="700" stroke="#1565C0" stroke-width="1.2" stroke-dasharray="6,4"/>
<line x1="300" y1="56" x2="300" y2="700" stroke="#2E7D32" stroke-width="1.2" stroke-dasharray="6,4"/>
<line x1="430" y1="56" x2="430" y2="700" stroke="#4527A0" stroke-width="1.2" stroke-dasharray="6,4"/>
<line x1="570" y1="56" x2="570" y2="700" stroke="#E65100" stroke-width="1.2" stroke-dasharray="6,4"/>
<line x1="700" y1="56" x2="700" y2="700" stroke="#00695C" stroke-width="1.2" stroke-dasharray="6,4"/>
<line x1="820" y1="56" x2="820" y2="700" stroke="#C62828" stroke-width="1.2" stroke-dasharray="6,4"/>
<line x1="940" y1="56" x2="940" y2="700" stroke="#37474F" stroke-width="1.2" stroke-dasharray="6,4"/>

<!-- MSG 1: Analyst → FastAPI: POST /api/ingest/instant -->
<line x1="60" y1="90" x2="174" y2="90" stroke="#1A237E" stroke-width="1.8" marker-end="url(#sa)"/>
<rect x="62" y="75" width="174" height="16" rx="3" fill="white" opacity=".9"/>
<text x="149" y="87" text-anchor="middle" font-size="9.5" fill="#0D47A1">POST /api/ingest/instant</text>

<!-- MSG 2: FastAPI → Ingest: raw_text -->
<line x1="180" y1="130" x2="294" y2="130" stroke="#1A237E" stroke-width="1.8" marker-end="url(#sa)"/>
<rect x="196" y="117" width="80" height="16" rx="3" fill="white" opacity=".9"/>
<text x="236" y="129" text-anchor="middle" font-size="9.5" fill="#0D47A1">raw_text</text>

<!-- MSG 3: Ingest → FastAPI: ThreatEvent (return, dashed) -->
<line x1="300" y1="170" x2="186" y2="170" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#sr)"/>
<rect x="202" y="157" width="80" height="16" rx="3" fill="white" opacity=".9"/>
<text x="242" y="169" text-anchor="middle" font-size="9.5" fill="#555">ThreatEvent</text>

<!-- MSG 4: FastAPI → Enrich: ThreatEvent -->
<line x1="180" y1="210" x2="424" y2="210" stroke="#1A237E" stroke-width="1.8" marker-end="url(#sa)"/>
<rect x="237" y="197" width="80" height="16" rx="3" fill="white" opacity=".9"/>
<text x="277" y="209" text-anchor="middle" font-size="9.5" fill="#0D47A1">ThreatEvent</text>

<!-- MSG 5: Enrich → ChromaDB: embed + query -->
<line x1="430" y1="250" x2="564" y2="250" stroke="#1A237E" stroke-width="1.8" marker-end="url(#sa)"/>
<rect x="452" y="237" width="90" height="16" rx="3" fill="white" opacity=".9"/>
<text x="497" y="249" text-anchor="middle" font-size="9.5" fill="#0D47A1">embed + query</text>

<!-- MSG 6: ChromaDB → Enrich: MITRE context (return, dashed) -->
<line x1="570" y1="290" x2="436" y2="290" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#sr)"/>
<rect x="450" y="277" width="92" height="16" rx="3" fill="white" opacity=".9"/>
<text x="496" y="289" text-anchor="middle" font-size="9.5" fill="#555">MITRE context</text>

<!-- MSG 7: Enrich self-loop (LLM call) -->
<path d="M430,325 L468,325 L468,345 L430,345" stroke="#1A237E" stroke-width="1.5" fill="none" marker-end="url(#sa)"/>
<text x="475" y="333" font-size="9" fill="#0D47A1">LLM prompt</text>
<text x="475" y="347" font-size="9" fill="#0D47A1">(llama3.2:3b)</text>

<!-- MSG 8: Enrich self-loop return (LLM output, dashed) -->
<path d="M430,375 L475,375 L475,395 L430,395" stroke="#888" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#sr)"/>
<text x="481" y="383" font-size="9" fill="#555">LLM JSON</text>
<text x="481" y="397" font-size="9" fill="#555">output</text>

<!-- MSG 9: Enrich → ChromaDB: store-back -->
<line x1="430" y1="430" x2="564" y2="430" stroke="#1A237E" stroke-width="1.8" marker-end="url(#sa)"/>
<rect x="452" y="417" width="80" height="16" rx="3" fill="white" opacity=".9"/>
<text x="492" y="429" text-anchor="middle" font-size="9.5" fill="#0D47A1">store-back</text>

<!-- MSG 10: Enrich → FastAPI: EnrichedEvent (return, dashed) -->
<line x1="430" y1="470" x2="186" y2="470" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#sr)"/>
<rect x="222" y="457" width="90" height="16" rx="3" fill="white" opacity=".9"/>
<text x="267" y="469" text-anchor="middle" font-size="9.5" fill="#555">EnrichedEvent</text>

<!-- MSG 11: FastAPI → Pattern: EnrichedEvent -->
<line x1="180" y1="510" x2="694" y2="510" stroke="#1A237E" stroke-width="1.8" marker-end="url(#sa)"/>
<rect x="380" y="497" width="90" height="16" rx="3" fill="white" opacity=".9"/>
<text x="425" y="509" text-anchor="middle" font-size="9.5" fill="#0D47A1">EnrichedEvent</text>

<!-- MSG 12: Pattern → FastAPI: ThreatPattern (return, dashed) -->
<line x1="700" y1="548" x2="186" y2="548" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#sr)"/>
<rect x="370" y="535" width="90" height="16" rx="3" fill="white" opacity=".9"/>
<text x="415" y="547" text-anchor="middle" font-size="9.5" fill="#555">ThreatPattern</text>

<!-- MSG 13: FastAPI → Mitigate: ThreatPattern -->
<line x1="180" y1="586" x2="814" y2="586" stroke="#1A237E" stroke-width="1.8" marker-end="url(#sa)"/>
<rect x="432" y="573" width="90" height="16" rx="3" fill="white" opacity=".9"/>
<text x="477" y="585" text-anchor="middle" font-size="9.5" fill="#0D47A1">ThreatPattern</text>

<!-- MSG 14: Mitigate → FastAPI: MitigationAction (return, dashed) -->
<line x1="820" y1="624" x2="186" y2="624" stroke="#888" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#sr)"/>
<rect x="424" y="611" width="108" height="16" rx="3" fill="white" opacity=".9"/>
<text x="478" y="623" text-anchor="middle" font-size="9.5" fill="#555">MitigationAction</text>

<!-- MSG 15: FastAPI → Validate: MitigationAction -->
<line x1="180" y1="662" x2="934" y2="662" stroke="#1A237E" stroke-width="1.8" marker-end="url(#sa)"/>
<rect x="490" y="649" width="110" height="16" rx="3" fill="white" opacity=".9"/>
<text x="545" y="661" text-anchor="middle" font-size="9.5" fill="#0D47A1">MitigationAction</text>
</svg>