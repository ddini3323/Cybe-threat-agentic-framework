services:

  # ── Ollama: local LLM server ─────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: cti-ollama
    volumes:
      - ollama_data:/root/.ollama      # model weights persist across restarts
    ports:
      - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Model pull: runs once, pulls llama3.2:3b then exits ─────────────────────
  ollama-pull:
    image: ollama/ollama:latest
    container_name: cti-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: >
      sh -c "ollama pull ${OLLAMA_MODEL:-llama3.2:3b} && echo 'Model ready'"
    restart: "no"

  # ── CTI Agentic System ────────────────────────────────────────────────────────
  cti-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cti-app
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - .env                           # copy .env.example → .env and edit
    environment:
      OLLAMA_HOST: http://ollama:11434  # override any .env value for Docker
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8888"
    ports:
      - "8888:8888"
    volumes:
      - cti_data:/app/data             # persist events, chroma_db, input files
      - cti_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  ollama_data:
  cti_data:
  cti_logs:
